<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin Wheel Arisan</title>
<style>
:root{--bg:#0b1119;--bg2:#15263a;--panel:#1b1e23;--line:#31373f;--text:#f1f3f5;--mute:#9aa4af;--accent:#1b66b8;--accent2:#2a7fd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:radial-gradient(1100px 700px at 25% 40%,var(--bg2),var(--bg) 70%);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif;color-scheme:dark}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:rgba(0,0,0,.45);border-bottom:1px solid #000}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;letter-spacing:.2px;white-space:nowrap}
.logo{width:34px;height:34px;border-radius:9px;flex:none;background:radial-gradient(circle,#fff 0 20%,transparent 21%),conic-gradient(#ffd54f,#ff9a5b,#ef6f91,#b57be0,#5b95ec,#4fcbe0,#74d68f,#ffd54f)}
.nav{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:hidden}
.mi{display:flex;align-items:center;gap:7px;padding:6px 12px;font-size:14px;font-weight:600;cursor:default;user-select:none;white-space:nowrap}
.nav .hbtn{display:flex;align-items:center;padding:6px 12px}
.ic{width:18px;height:18px;fill:currentColor;flex:none}
@media(max-width:860px){.mi .t{display:none}.mi{padding:6px 7px}.brand{font-size:18px}}
@media(max-width:560px){.mi{display:none}}
.hbtn{background:none;border:0;color:var(--text);font:inherit;font-size:14px;font-weight:500;cursor:pointer;padding:6px 10px;border-radius:6px}
.hbtn:hover{background:rgba(255,255,255,.08)}
main{display:flex;flex-wrap:wrap;gap:16px;padding:12px 20px 28px;align-items:flex-start}
.stage{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
h1{font-size:34px;font-weight:500;margin:6px 0 4px;outline:none;border-radius:6px;padding:0 6px;margin-left:-6px}
h1:focus{background:rgba(255,255,255,.07)}
.wrap{align-self:center}
canvas{display:block;cursor:pointer;touch-action:manipulation}
aside{flex:0 0 360px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-weight:600;padding:14px 8px 11px;cursor:pointer}
.tab[aria-selected=true]{color:var(--text);border-bottom-color:var(--text)}
.badge{display:inline-block;min-width:22px;padding:0 7px;border-radius:99px;background:#3b4048;font-size:12px;line-height:20px;margin-left:6px}
.pane{padding:16px}
.row{display:flex;gap:8px;margin-bottom:14px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:4px;font:inherit;font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:#2c3138}
.btn.ghost:hover{background:#39404a}
textarea{width:100%;height:340px;resize:vertical;background:#15181c;color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font:inherit;font-size:15px;line-height:1.7}
ul{list-style:none;margin:0;padding:0;max-height:400px;overflow:auto}
li{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:15px}
li span{color:var(--mute);font-size:12px;align-self:center}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
dialog{border:0;border-radius:6px;padding:0;background:#1f1f1f;color:var(--text);width:min(800px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dh{background:#1b66b8;padding:20px 20px;font-weight:700;font-size:24px}
.dn{padding:40px 20px 34px;font-size:clamp(34px,7vw,58px);font-weight:300;letter-spacing:.5px;text-align:center;overflow-wrap:anywhere}
.df{display:flex;justify-content:flex-end;gap:6px;padding:0 10px 10px}
.df .btn.ghost{background:none}
.df .btn.ghost:hover{background:#333}
#drem{background:#4a3fb5}
#drem:hover{background:#5b4fd0}
#confetti{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;pointer-events:none;overflow:hidden}
#sec{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:max(10px,env(safe-area-inset-bottom,0px));width:18px;height:18px;padding:2px;background:none;border:0;color:#fff;opacity:.1;cursor:pointer;z-index:20}
#sec:hover,#sec:focus-visible{opacity:.5}
#sec svg{display:block;width:100%;height:100%;fill:currentColor}
#pop{position:fixed;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(34px + env(safe-area-inset-bottom,0px));width:210px;max-height:60vh;overflow:auto;background:#14171b;border:1px solid var(--line);border-radius:8px;padding:8px;z-index:21;box-shadow:0 10px 30px rgba(0,0,0,.6)}
#pop p{margin:2px 4px 8px;font-size:12px;color:var(--mute)}
#pop button{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;color:var(--text);font:inherit;font-size:13px;padding:6px 8px;border-radius:5px;cursor:pointer}
#pop button:hover{background:#242a31}
#pop button[aria-pressed=true]{border-color:var(--accent2);background:#17314d}
@media(max-width:860px){aside{flex-basis:100%}h1{font-size:28px}textarea{height:240px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo" aria-hidden="true"></span>Spin Wheel</div>
  <nav class="nav">
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 100 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.3-.5-.8-.5-1.2 0-1.1.9-2 2-2H17a4 4 0 004-4c0-4.4-4-8-9-8zM6.5 12a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3-4a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm5 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 4a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/></svg><span class="t">Kustomisasi</span></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg><span class="t">Baru</span></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg><span class="t">Buka</span></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><path d="M17 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16a3 3 0 110-6 3 3 0 010 6zm3-10H5V5h10v4z"/></svg><span class="t">Simpan</span></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8 11l8-5M8 13l8 5" stroke="currentColor" stroke-width="2" fill="none"/></svg><span class="t">Bagikan</span></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15 15l6 6" stroke="currentColor" stroke-width="2.4"/></svg><span class="t">Galeri</span></span>
    <button class="hbtn" id="fs" title="Layar penuh" aria-label="Layar penuh"><svg class="ic" viewBox="0 0 24 24"><path d="M4 4h6v2H6v4H4zM14 4h6v6h-2V6h-4zM4 14h2v4h4v2H4zM18 14h2v6h-6v-2h4z"/></svg></button>
    <span class="mi"><span class="t">Lainnya</span><svg class="ic" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg></span>
    <span class="mi"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span class="t">Indonesia</span></span>
  </nav>
</header>
<main>
  <section class="stage">
    <h1 id="title" contenteditable="true" spellcheck="false" title="Klik untuk mengganti judul">Arisan</h1>
    <div class="wrap"><canvas id="wheel" aria-label="Roda nama"></canvas></div>
  </section>
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t1" aria-selected="true">Nama<span class="badge" id="c1">0</span></button>
      <button class="tab" role="tab" id="t2" aria-selected="false">Hasil<span class="badge" id="c2">0</span></button>
    </div>
    <div class="pane" id="p1">
      <div class="row">
        <button class="btn" id="shuf">Acak urutan</button>
        <button class="btn" id="sort">Urutkan A–Z</button>
      </div>
      <textarea id="names" spellcheck="false" aria-label="Daftar nama, satu per baris"></textarea>
    </div>
    <div class="pane" id="p2" hidden>
      <div class="row"><button class="btn ghost" id="clr">Kosongkan hasil</button></div>
      <ul id="res"></ul>
      <div class="empty" id="resEmpty">Belum ada hasil. Putar rodanya dulu.</div>
    </div>
  </aside>
</main>

<dialog id="dlg">
  <div class="dh">Kita punya pemenang!</div>
  <div class="dn" id="dname"></div>
  <div class="df">
    <button class="btn ghost" id="dclose">Tutup</button>
    <button class="btn" id="drem">Hapus</button>
  </div>
</dialog>

<button id="sec" aria-label="Opsi" title=""><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg></button>
<div id="pop" hidden></div>
<canvas id="confetti" popover="manual" aria-hidden="true"></canvas>

<script>
(function(){
var TAU=Math.PI*2;
var COL=[['#1b66b8','#ffffff'],['#f2f2f2','#222222'],['#3b3b3b','#ffffff'],['#9b9b9b','#111111']];
var DEF=['Jikman 1','Teguh','Etha 1','Astrid 2','Jikman 2','Bu Mang','Bagus','Mikha','Etha 2','Astrid 1','Mubin'];
var $=function(s){return document.querySelector(s)};
var cv=$('#wheel'),ctx=cv.getContext('2d'),ta=$('#names');
var names=[],rot=0,spinning=false,started=false,forced=null,results=[],lastWin=-1;

try{var saved=localStorage.getItem('arisan-names');ta.value=saved!==null?saved:DEF.join('\n');}catch(e){ta.value=DEF.join('\n');}

function parse(){
  names=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  $('#c1').textContent=names.length;
  if(forced!==null&&names.indexOf(forced)<0)forced=null;
  try{localStorage.setItem('arisan-names',ta.value)}catch(e){}
  draw();
}

function fit(){
  var w=window.innerWidth,h=window.innerHeight;
  var s=w<=860?w-24:w-420;
  s=Math.max(300,Math.min(s,h-110,940));
  var d=window.devicePixelRatio||1;
  cv.style.width=cv.style.height=s+'px';
  cv.width=cv.height=Math.round(s*d);
  draw();
}

function arcText(txt,c,r,ca,top,fs){
  var fam='Roboto,"Segoe UI",system-ui,sans-serif',sp=fs*0.04;
  ctx.font='800 '+fs+'px '+fam;
  var tw=ctx.measureText(txt).width+sp*(txt.length-1);
  if(tw/r>2){fs*=2/(tw/r);sp=fs*0.04;ctx.font='800 '+fs+'px '+fam;tw=ctx.measureText(txt).width+sp*(txt.length-1);}
  var th=top?ca-tw/(2*r):ca+tw/(2*r);
  for(var i=0;i<txt.length;i++){
    var ch=txt.charAt(i),cw=ctx.measureText(ch).width,a=cw/r,m=top?th+a/2:th-a/2;
    ctx.save();
    ctx.translate(c+Math.cos(m)*r,c+Math.sin(m)*r);
    ctx.rotate(top?m+Math.PI/2:m-Math.PI/2);
    ctx.fillText(ch,0,0);
    ctx.restore();
    var step=a+sp/r;th=top?th+step:th-step;
  }
}

function draw(){
  var W=cv.width,c=W/2,R=c*0.9,n=names.length;
  var k=W/parseFloat(cv.style.width||W);
  ctx.clearRect(0,0,W,W);
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=28*k;ctx.shadowOffsetY=6*k;
  ctx.beginPath();ctx.arc(c,c,R,0,TAU);ctx.fillStyle='#3b3b3b';ctx.fill();
  ctx.restore();
  var seg=TAU/Math.max(n,1);
  for(var i=0;i<n;i++){
    var q=i%4;if(i===n-1&&n>1&&n%4===1)q=2;
    var a0=rot+i*seg;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,a0,a0+seg);ctx.closePath();
    ctx.fillStyle=COL[q][0];ctx.fill();
    ctx.save();ctx.translate(c,c);ctx.rotate(a0+seg/2);
    ctx.fillStyle=COL[q][1];ctx.textAlign='right';ctx.textBaseline='middle';
    var fs=Math.max(11*k,Math.min(R*0.1,R*seg*0.42));
    ctx.font='500 '+fs+'px Roboto,"Segoe UI",system-ui,sans-serif';
    var t=names[i],maxw=R*0.58;
    while(t.length>2&&ctx.measureText(t).width>maxw)t=t.slice(0,-2)+'…';
    ctx.fillText(t,R-R*0.07,0);
    ctx.restore();
  }
  // hub
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14*k;
  ctx.beginPath();ctx.arc(c,c,R*0.3,0,TAU);ctx.fillStyle='#fff';ctx.fill();
  ctx.restore();
  ctx.fillStyle='#0d3b73';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='800 '+(R*0.17)+'px Roboto,"Segoe UI",system-ui,sans-serif';
  ctx.fillText('CBN',c,c);
  // pointer
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=8*k;ctx.shadowOffsetX=2*k;ctx.shadowOffsetY=2*k;
  var tx=c+R-R*0.045,bx=c+R+R*0.1,hh=R*0.065;
  var g1=ctx.createLinearGradient(0,c-hh,0,c);g1.addColorStop(0,'#dcdcdc');g1.addColorStop(1,'#b4b4b4');
  ctx.beginPath();ctx.moveTo(tx,c);ctx.lineTo(bx,c-hh);ctx.lineTo(bx,c);ctx.closePath();ctx.fillStyle=g1;ctx.fill();
  ctx.shadowColor='transparent';
  var g2=ctx.createLinearGradient(0,c,0,c+hh);g2.addColorStop(0,'#9a9a9a');g2.addColorStop(1,'#6e6e6e');
  ctx.beginPath();ctx.moveTo(tx,c);ctx.lineTo(bx,c);ctx.lineTo(bx,c+hh);ctx.closePath();ctx.fillStyle=g2;ctx.fill();
  ctx.restore();
  // hint
  if(!started&&n){
    ctx.save();
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.85)';ctx.shadowBlur=7*k;ctx.shadowOffsetY=2*k;
    arcText('Click to spin',c,R*0.62,-Math.PI/2,true,R*0.125);
    arcText('or press ctrl+enter',c,R*0.58,Math.PI/2,false,R*0.105);
    ctx.restore();
  }
}

function spin(){
  if(spinning||!names.length)return;
  spinning=true;started=true;
  if($('#dlg').open)$('#dlg').close();
  var n=names.length,seg=TAU/n;
  var k=Math.floor(Math.random()*n);
  if(forced!==null){var j=names.indexOf(forced);if(j>=0)k=j;}
  forced=null;renderPop();
  var f=0.15+Math.random()*0.7;
  var desired=-(k+f)*seg;
  var min=rot+TAU*(5+Math.random()*3);
  var fin=desired+TAU*Math.ceil((min-desired)/TAU);
  var start=rot,dur=5200+Math.random()*1400,t0=performance.now();
  function step(t){
    var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+(fin-start)*e;draw();
    if(p<1)requestAnimationFrame(step);
    else{spinning=false;rot=rot%TAU;win(k);}
  }
  requestAnimationFrame(step);
}

function win(i){
  lastWin=i;
  var nm=names[i];
  results.unshift({name:nm,time:new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});
  renderRes();
  $('#dname').textContent=nm;
  $('#dlg').showModal();
  confetti();
}

function renderRes(){
  var ul=$('#res');ul.innerHTML='';
  results.forEach(function(r){
    var li=document.createElement('li');
    var a=document.createElement('b');a.textContent=r.name;a.style.fontWeight=500;
    var b=document.createElement('span');b.textContent=r.time;
    li.appendChild(a);li.appendChild(b);ul.appendChild(li);
  });
  $('#c2').textContent=results.length;
  $('#resEmpty').hidden=results.length>0;
}

function tab(n){
  $('#p1').hidden=n!==1;$('#p2').hidden=n!==2;
  $('#t1').setAttribute('aria-selected',n===1);$('#t2').setAttribute('aria-selected',n===2);
}

// confetti
var cc=$('#confetti'),cx=cc.getContext('2d'),parts=[],cRun=false;
var CC=['#1b66b8','#2a7fd8','#f2f2f2','#ff5a5f','#ffc233','#3ddc97','#a66cff','#ff8fab'];
function burst(x,y,a,spread,n,speed){
  for(var i=0;i<n;i++){
    var ang=a+(Math.random()-0.5)*spread,v=speed*(0.35+Math.random()*0.65);
    parts.push({x:x,y:y,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v,r:Math.random()*TAU,vr:(Math.random()-0.5)*0.4,
      fl:Math.random()*TAU,w:6+Math.random()*7,h:5+Math.random()*7,c:CC[Math.floor(Math.random()*CC.length)],
      t:0,life:190+Math.random()*130});
  }
}
function confetti(){
  if(calm.matches)return;
  var d=window.devicePixelRatio||1,W=window.innerWidth,H=window.innerHeight;
  cc.width=Math.round(W*d);cc.height=Math.round(H*d);
  try{if(!cc.matches(':popover-open'))cc.showPopover();}catch(e){cc.style.zIndex=99;}
  var v=Math.max(14,H/34);
  burst(W*0.05,H*0.95,-1.1,0.7,80,v*1.05);
  burst(W*0.95,H*0.95,-Math.PI+1.1,0.7,80,v*1.05);
  [250,550,850].forEach(function(ms){
    setTimeout(function(){burst(W*(0.15+Math.random()*0.7),H*(0.2+Math.random()*0.25),0,TAU,45,v*0.55);},ms);
  });
  if(cRun)return;
  cRun=true;
  var last=performance.now();
  function f(now){
    var k=Math.min((now-last)/16.67,3);last=now;
    cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,W,H);
    parts=parts.filter(function(p){return p.t<p.life&&p.y<H+30;});
    parts.forEach(function(p){
      p.t+=k;
      var dr=Math.pow(0.985,k);
      p.vx*=dr;p.vy=p.vy*dr+0.25*k;
      p.x+=p.vx*k;p.y+=p.vy*k;p.r+=p.vr*k;p.fl+=0.15*k;
      cx.save();
      cx.globalAlpha=Math.max(0,Math.min(1,(p.life-p.t)/40));
      cx.translate(p.x,p.y);cx.rotate(p.r);
      cx.fillStyle=p.c;
      cx.fillRect(-p.w/2,-p.h/2,p.w,Math.max(1.5,p.h*Math.abs(Math.cos(p.fl))));
      cx.restore();
    });
    if(parts.length)requestAnimationFrame(f);
    else{cRun=false;try{cc.hidePopover();}catch(e){}}
  }
  requestAnimationFrame(f);
}

// hidden selector
function renderPop(){
  var pop=$('#pop');pop.innerHTML='';
  var p=document.createElement('p');p.textContent='Berikutnya:';pop.appendChild(p);
  names.forEach(function(nm){
    var b=document.createElement('button');
    b.textContent=nm;b.setAttribute('aria-pressed',forced===nm);
    b.addEventListener('click',function(e){
      e.stopPropagation();
      forced=(forced===nm)?null:nm;
      renderPop();
    });
    pop.appendChild(b);
  });
  var r=document.createElement('button');
  r.textContent='Acak (normal)';r.style.color='#9aa4af';
  r.addEventListener('click',function(e){e.stopPropagation();forced=null;renderPop();});
  pop.appendChild(r);
}

$('#sec').addEventListener('click',function(e){
  e.stopPropagation();
  var pop=$('#pop');
  if(pop.hidden){renderPop();pop.hidden=false;}else pop.hidden=true;
});
document.addEventListener('click',function(e){
  var pop=$('#pop');
  if(!pop.hidden&&!pop.contains(e.target))pop.hidden=true;
});

cv.addEventListener('click',spin);
document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();spin();}
  if(e.key==='Escape')$('#pop').hidden=true;
});
ta.addEventListener('input',parse);
$('#shuf').addEventListener('click',function(){
  var a=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  ta.value=a.join('\n');parse();
});
$('#sort').addEventListener('click',function(){
  var a=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  a.sort(function(x,y){return x.localeCompare(y,'id',{numeric:true})});
  ta.value=a.join('\n');parse();
});
$('#t1').addEventListener('click',function(){tab(1)});
$('#t2').addEventListener('click',function(){tab(2)});
$('#clr').addEventListener('click',function(){results=[];renderRes();});
$('#dclose').addEventListener('click',function(){$('#dlg').close()});
$('#drem').addEventListener('click',function(){
  var nm=names[lastWin];
  var a=ta.value.split('\n');
  var idx=a.findIndex(function(s){return s.trim()===nm});
  if(idx>=0)a.splice(idx,1);
  ta.value=a.join('\n');parse();$('#dlg').close();
});
$('#fs').addEventListener('click',function(){
  if(document.fullscreenElement)document.exitFullscreen();
  else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();
});
$('#title').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();this.blur();}});
window.addEventListener('resize',fit);

// putaran pelan saat idle
var lastT=0,calm=window.matchMedia('(prefers-reduced-motion: reduce)');
function idle(t){
  var dt=Math.min(t-lastT,50);lastT=t;
  if(!spinning&&names.length&&!$('#dlg').open){
    rot=(rot+dt*0.00012)%TAU;draw();
  }
  requestAnimationFrame(idle);
}
requestAnimationFrame(idle);

parse();fit();renderRes();
})();
</script>
</body>
</html>
